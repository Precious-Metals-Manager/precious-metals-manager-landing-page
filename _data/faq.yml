# Home-page FAQ. Plain-text answers so the visible accordion and the
# FAQPage structured data stay clean. Edit/add entries freely.

- question: Is Precious Metals Manager free to use?
  answer: >-
    Yes. The app is free to download and lets you track up to 10 items and 3
    orders with core portfolio metrics — no account and no credit card required.
    A Pro subscription unlocks unlimited tracking and advanced tools.

- question: What's included in Pro, and how much does it cost?
  answer: >-
    Pro removes all limits and adds live spot and dealer offer prices, price and
    ratio alerts, and annual tax reports with CSV export. It's $2.99 per month or
    $29.99 per year (US pricing; your local price is shown in the App Store).

- question: Is there a free trial?
  answer: >-
    Yes. Pro comes with a free trial, and you can cancel anytime. Subscriptions
    are billed through your App Store account.

- question: What features and tools does the app include?
  answer: >-
    Plenty. Alongside inventory tracking you get portfolio valuation and metal
    allocation, live spot and dealer offer prices, dollar-cost-averaging and
    average-cost analytics, value- and weight-over-time charts, an annual tax
    report, the gold-to-silver ratio, metal-versus-crypto performance and
    correlation, premium and purity-value calculators, price and ratio alerts,
    monthly budgets, and a home-screen spot-price widget.

- question: Which precious metals can I track?
  answer: >-
    Gold, silver, platinum and palladium — including coins, bars and rounds, with
    purity, weight and premium tracked for each item.

- question: Can I track orders, sales and graded coins?
  answer: >-
    Yes. Record each purchase as an order with dealer, invoice and shipping
    details, add items with metal, weight, purity, premium and photos, organise
    them as coins, bars or rounds, and log third-party grading. Sales are tracked
    too, so you can see both realised and unrealised gains.

- question: Does it work on iPad?
  answer: >-
    Yes. Precious Metals Manager is a universal app that runs on both iPhone and
    iPad, adapting its layout to each screen size.

- question: Is my portfolio data private?
  answer: >-
    Absolutely. Your data is stored locally on your device and synced only
    through your private iCloud account, which you can disable at any time.
    Nothing is sent to our servers, and Face ID / Touch ID add extra protection.

- question: Can I export my data or generate tax reports?
  answer: >-
    Yes. Pro includes annual tax reports and CSV export, so you can back up your
    portfolio or hand clean figures to your accountant.

- question: Is there an Android version?
  answer: >-
    Not yet — Precious Metals Manager is currently available on iPhone and iPad
    only.
