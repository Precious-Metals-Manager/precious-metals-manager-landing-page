# Theme Settings
link_color                                : "#1d63ea"


# Pagination
paginate: 6
paginate_path: /blog/page:num/


plugins:
  - jekyll-seo-tag        # Adds all the important SEO meta tags by default.
  - jekyll-sitemap        # Adds sitemap to the website at /sitemap.xml
  - jekyll-include-cache  # use include_cached instead of include
  - jekyll-paginate       # Used for sorting posts by page numbers.


# Google Tag
# The Analytics tag is a snippet of JavaScript that collects and sends data to Analytics from a website.
google-tag: G-WXNPC82QM4

# This defines how the URLs should look like.
permalink: /blog/:title/

####################################################
### Jekyll Configuration. No need to touch this. ###
####################################################

# Set the Sass partials directory, as we're using @imports
sass:
  style: compressed # You might prefer to minify using :compressed
  sass_dir: /assets/css/_sass

# Exclude these files from your production _site
exclude:
  - LICENSE
  - README.md
  - CNAME

# Docs: https://jekyllrb.com/docs/collections/
collections:
  pages:
    output: true
    permalink: /:path/
  getting-started:
    output: true
    permalink: /help/:path/
  backup-and-restore:
    output: true
    permalink: /help/:path/
  other-features:
    output: true
    permalink: /help/:path/

# Markdown rendering
markdown: kramdown
