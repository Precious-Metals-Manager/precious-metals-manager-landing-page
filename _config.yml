# Site
title: Precious Metals Manager
description: Effortlessly track your precious metals investments with our specialized mobile app. Take control of your portfolio management with powerful metrics and tools for gold, silver, platinum, and palladium.
url: https://preciousmetalsmanager.com

# Page title
page_title                                : Precious Metals Manager                   # Automatically populates with app name if not set and if iOS app ID is set. Otherwise enter manually.

# App Info
ios_app_id                                : 1636327607                                # Required. Enter iOS app ID to automatically populate name, price and icons (e.g. 718043190).
ios_app_country                           : us                                        # Required outside USA. Enter 2 letter country code as in https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2

appstore_link                             : https://apps.apple.com/app/id1636327607  # Automatically populates if not set and if iOS app ID is set. Otherwise enter manually.
playstore_link                            :                                           # Enter Google Play Store URL.
presskit_download_link                    :                                           # Enter a link to downloadable file or (e.g. public Dropbox link to a .zip file). 
                                                                                      # Or upload your press kit file to assets and set path accordingly (e.g. "assets/your_press_kit.zip").

app_icon                                  : assets/images/icon.svg                    # Automatically populates if not set and if iOS app ID is set.  Otherwise enter path to icon file manually.
app_name                                  : Precious Metals Manager                   # Automatically populates if not set and if iOS app ID is set.  Otherwise enter manually.
app_price                                 :                                           # Automatically populates if not set and if iOS app ID is set.  Otherwise enter manually.
app_description                           : Track your precious metals with ease.

enable_smart_app_banner                   : true                                      # Set to true to show a smart app banner at top of page on mobile devices.


# Pricing (freemium) — powers the Free vs Pro section on the home page.
# Confirm these match App Store Connect before each release.
free_item_limit                           : 10                                        # Items allowed on the free tier.
free_order_limit                          : 3                                         # Orders allowed on the free tier.
pro_price_monthly                         : "$2.99"                                    # Pro monthly price (display string).
pro_price_yearly                          : "$29.99"                                   # Pro yearly price (display string).
pro_has_free_trial                        : true                                      # Set false to hide the free-trial badge/CTA.


# Social proof — shown in the "Loved by stackers" section.
# Rating values are the US App Store storefront; refresh occasionally.
app_rating                                : "4.4"                                      # Average star rating.
app_rating_count                          : "81"                                       # Number of ratings.
app_users                                 : "10,000+"                                  # Total App Store downloads (rounded down). Blank hides the line.
# Featured testimonials live in _data/testimonials.yml (real App Store reviews).



# Information About Yourself
your_name                                 : Precious Metals Manager                                
your_link                                 :                    
your_city                                 : Spain                                
email_address                             : sergio@preciousmetalsmanager.com
facebook_username                         : 100084229184603                                         
instagram_username                        : preciousmetalsmanager
x_username                                : metalsmanager
github_username                           : 
