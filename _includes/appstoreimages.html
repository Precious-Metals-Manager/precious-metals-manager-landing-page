{% if site.ios_app_id %}

<script>
document.addEventListener('DOMContentLoaded', function () {
    var apiURL = "https://itunes.apple.com/lookup?id={{ site.ios_app_id }}&country={{ site.ios_app_country }}";

    fetch(apiURL)
        .then(function (response) { return response.json(); })
        .then(function (json) {
            if (!json.results || !json.results.length) return;

            var appInfo = json.results[0];

            // Set favicon
            var favicon = document.querySelector('link[rel="shortcut icon"]');
            if (favicon) favicon.href = appInfo.artworkUrl512;

            // Set page title if not set in _config.yml
            var pageTitle = document.querySelector('.pageTitle');
            if (pageTitle && pageTitle.textContent.trim().length === 0) {
                pageTitle.textContent = appInfo.trackName;
            }

            // Set large app icon if not set
            var appIconLarge = document.querySelector('.appIconLarge');
            if (appIconLarge && !appIconLarge.src) {
                appIconLarge.src = appInfo.artworkUrl512;
            }

            // Set header app icon if not set
            var appIconHeader = document.querySelector('.headerIcon');
            if (appIconHeader && !appIconHeader.src) {
                appIconHeader.src = appInfo.artworkUrl512;
            }

            // Set app name if not set
            var appName = document.querySelector('.appName');
            if (appName && appName.textContent.trim().length === 0) {
                appName.textContent = appInfo.trackName;
            }

            // Set header name if not set
            var headerName = document.querySelector('.headerName');
            if (headerName && headerName.textContent.trim().length === 0) {
                headerName.textContent = appInfo.trackName;
            }

            // Set price if not set
            var appPrice = document.querySelector('.appPrice');
            if (appPrice && appPrice.textContent.trim().length === 0) {
                appPrice.textContent = appInfo.formattedPrice;
            }

            // Set App Store link if not set (use getAttribute to get raw attribute, not resolved URL)
            document.querySelectorAll('.appStoreLink').forEach(function (el) {
                if (!el.getAttribute('href') || !el.getAttribute('href').trim()) {
                    el.href = appInfo.trackViewUrl;
                }
            });
        })
        .catch(function (err) {
            console.warn('Could not load app info from iTunes API:', err);
        });
});
</script>

{% endif %}
