<div id="cookie-notice" role="dialog" aria-modal="false" aria-live="polite" aria-label="Cookie consent">
    <div class="cookie-notice-inner">
        <div class="cookie-notice-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5Z"></path>
                <circle cx="8.5" cy="12.5" r="0.6" fill="currentColor"></circle>
                <circle cx="12.5" cy="16" r="0.6" fill="currentColor"></circle>
                <circle cx="15.5" cy="12" r="0.6" fill="currentColor"></circle>
                <circle cx="9" cy="8.5" r="0.6" fill="currentColor"></circle>
            </svg>
        </div>
        <div class="cookie-notice-text">
            <span class="cookie-notice-title">We value your privacy</span>
            <span class="cookie-notice-description">We use third party cookies to analyse traffic and improve your experience on this website. You can accept or decline them below.</span>
            <a href="/privacypolicy" class="cookie-notice-link">Read our privacy policy</a>
        </div>
        <div class="cookie-consent-banner-actions">
            <button type="button" id="cookie-notice-decline" class="cookie-btn cookie-btn-secondary" aria-label="Decline non-essential cookies">Decline</button>
            <button type="button" id="cookie-notice-accept" class="cookie-btn cookie-btn-primary" aria-label="Accept cookies">Accept</button>
        </div>
    </div>
</div>
<script>
    function createCookie(name, value, days) {
        var expires = "";
        if (days) {
            var date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + value + expires + "; path=/; SameSite=Lax";
    }
    function readCookie(name) {
        var nameEQ = name + "=";
        var ca = document.cookie.split(';');
        for (var i = 0; i < ca.length; i++) {
            var c = ca[i];
            while (c.charAt(0) == ' ') c = c.substring(1, c.length);
            if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
        }
        return null;
    }
    function eraseCookie(name) {
        createCookie(name, "", -1);
    }

    (function () {
        var notice = document.getElementById('cookie-notice');
        var consent = readCookie('cookie-consent');
        // Backwards compatibility with the previous banner's cookie
        if (!consent && readCookie('cookie-notice-dismissed') == 'true') {
            consent = 'accepted';
        }

        function hideNotice() {
            notice.classList.remove('is-visible');
            window.setTimeout(function () {
                notice.style.display = 'none';
            }, 350);
        }

        if (consent == 'accepted') {
            {% include google-tag.js %}
            notice.style.display = 'none';
        } else if (consent == 'declined') {
            notice.style.display = 'none';
        } else {
            notice.style.display = 'block';
            // Trigger the slide-up transition after the element is painted
            window.requestAnimationFrame(function () {
                window.requestAnimationFrame(function () {
                    notice.classList.add('is-visible');
                });
            });
        }

        document.getElementById('cookie-notice-accept').addEventListener("click", function () {
            createCookie('cookie-consent', 'accepted', 365);
            hideNotice();
            {% include google-tag.js %}
        });

        document.getElementById('cookie-notice-decline').addEventListener("click", function () {
            createCookie('cookie-consent', 'declined', 365);
            hideNotice();
        });
    })();
</script>
